name: Build Accounting Edition V2
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Clone Winlator source if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, cloning Winlator..."
            git clone --depth 1 https://github.com/brunodev85/winlator.git temp_winlator
            cp -r temp_winlator/* .
            cp -r temp_winlator/.github . 2>/dev/null || true
            rm -rf temp_winlator
          fi
          git submodule update --init --recursive || true
          chmod +x gradlew
          ls -la

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Build Accounting APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-Accounting-Ultra-V2
          path: app/build/outputs/apk/debug/*.apk
