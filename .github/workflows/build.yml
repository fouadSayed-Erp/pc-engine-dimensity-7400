name: Build PC Engine V3 Pro Full Store
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Official Winlator
        run: git clone --recursive https://github.com/brunodev85/winlator.git winlator
      - name: Build Full PC Engine Store + Liquid Glass
        run: |
          cd winlator/app
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">PC Engine V3 Pro<\/string>/g' app/src/main/res/values/strings.xml || true
          cat > app/src/main/res/values/colors_liquid.xml << 'COLORS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="liquid_teal">#FF00BCD4</color>
              <color name="liquid_blue">#FF2196F3</color>
              <color name="liquid_cyan">#FF00E5FF</color>
          </resources>
          COLORS
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/liquid_glass_card.xml << 'DRAW'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="24dp"/>
              <solid android:color="#66FFFFFF"/>
              <stroke android:width="1.5dp" android:color="#80FFFFFF"/>
          </shape>
          DRAW
          cat > app/src/main/res/drawable/liquid_glass_bg.xml << 'DRAW2'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="135" android:startColor="#FF00BCD4" android:centerColor="#FF2196F3" android:endColor="#FF00E5FF" type="linear"/>
          </shape>
          DRAW2
          cat > app/src/main/res/values/themes_liquid.xml << 'THEME'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PCEngine.V3Pro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@drawable/liquid_glass_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="colorPrimary">@color/liquid_teal</item>
              </style>
          </resources>
          THEME
          sed -i 's/android:theme="[^"]*"/android:theme="@style\/Theme.PCEngine.V3Pro"/g' app/src/main/AndroidManifest.xml || true
          STORE_JAVA_DIR=$(find app/src/main/java -type d -name "winlator" | head -1)
          cat > $STORE_JAVA_DIR/PCEngineStoreActivity.java << 'JAVA'
          package com.winlator;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class PCEngineStoreActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("PC Engine Store V3 Pro\n\nAccounting: Excel, QuickBooks, SAP, Daftra\nDrivers: WiFi, GPU, Audio, System\nTools: Chrome, Firefox, Terminal");
                  tv.setTextSize(18); tv.setPadding(40,100,40,40); setContentView(tv);
              }
          }
          JAVA
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Build V3 Pro APK
        working-directory: ./winlator/app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-V3-Pro-Full-Store
          path: winlator/app/app/build/outputs/apk/debug/*.apk
