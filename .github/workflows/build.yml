name: Build PC Engine V6 Store EXE
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Winlator
        run: git clone --recursive https://github.com/brunodev85/winlator.git winlator
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Store EXE
        run: |
          dotnet new winforms -n PCEngineStore -o store-src
          printf '%s\n' 'using System; using System.Drawing; using System.Windows.Forms; namespace PCEngineStore { static class Program { [STAThread] static void Main(){ Application.EnableVisualStyles(); var f=new Form(){Text="PC Engine Store V6 EXE",Width=900,Height=600,BackColor=Color.FromArgb(0,188,212)}; var b=new Button(){Text="Install Excel 2024.5",Width=200,Height=50,Top=20,Left=20,BackColor=Color.FromArgb(0,188,212),ForeColor=Color.White}; b.Click+=(s,e)=>MessageBox.Show("Installing Excel"); f.Controls.Add(b); Application.Run(f); } } }' > store-src/Program.cs
          dotnet publish store-src -c Release -r win-x86 --self-contained false -o store-exe
          ls store-exe/
      - name: Inject EXE into Windows System
        run: |
          cd winlator/app
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">PC Engine V6 EXE<\/string>/g' app/src/main/res/values/strings.xml || true
          mkdir -p app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store
          cp../../store-exe/*.exe app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store/ || true
          ls app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store/
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Build APK
        working-directory:./winlator/app
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-V6-EXE
          path: |
            winlator/app/app/build/outputs/apk/debug/*.apk
            store-exe/*
