name: Build PC Engine V5 System Integrated
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Winlator
        run: git clone --recursive https://github.com/brunodev85/winlator.git winlator
      - name: Integrate System
        run: |
          cd winlator/app
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">PC Engine V5<\/string>/g' app/src/main/res/values/strings.xml || true
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/liquid_glass_bg.xml << 'BG'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="135" android:startColor="#FF00BCD4" android:centerColor="#FF2196F3" android:endColor="#FF00E5FF" type="linear"/></shape>
          BG
          mkdir -p app/src/main/assets/pc-engine-store
          echo "<html dir='rtl'><h1>PC Engine Store V5 Integrated</h1></html>" > app/src/main/assets/pc-engine-store/PC_Engine_Store.html
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Build APK
        working-directory: ./winlator/app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-V5-System-Integrated
          path: winlator/app/app/build/outputs/apk/debug/*.apk
