name: Build PC Engine Liquid Glass Edition
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Official Winlator
        run: |
          git clone --recursive https://github.com/brunodev85/winlator.git winlator
      - name: Apply Liquid Glass Theme
        run: |
          cd winlator/app
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">PC Engine Liquid Glass<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/Winlator/PC Engine/g' app/src/main/res/values/strings.xml || true
          cat > app/src/main/res/values/colors_liquid.xml << 'COLORS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="liquid_glass_primary">#66FFFFFF</color>
              <color name="liquid_teal">#FF00BCD4</color>
              <color name="liquid_blue">#FF2196F3</color>
              <color name="liquid_cyan">#FF00E5FF</color>
          </resources>
          COLORS
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/liquid_glass_card.xml << 'DRAW'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="24dp"/>
              <solid android:color="#66FFFFFF"/>
              <stroke android:width="1.5dp" android:color="#80FFFFFF"/>
          </shape>
          DRAW
          cat > app/src/main/res/drawable/liquid_glass_bg.xml << 'DRAW3'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="135" android:startColor="#FF00BCD4" android:centerColor="#FF2196F3" android:endColor="#FF00E5FF" android:type="linear"/>
          </shape>
          DRAW3
          cat > app/src/main/res/values/themes_liquid.xml << 'THEME'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PCEngine.LiquidGlass" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@drawable/liquid_glass_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="colorPrimary">@color/liquid_teal</item>
                  <item name="colorPrimaryDark">@color/liquid_blue</item>
              </style>
          </resources>
          THEME
          sed -i 's/android:theme="[^"]*"/android:theme="@style\/Theme.PCEngine.LiquidGlass"/g' app/src/main/AndroidManifest.xml || true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Build Liquid Glass APK
        working-directory: ./winlator/app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-Liquid-Glass-Accounting
          path: winlator/app/app/build/outputs/apk/debug/*.apk
