name: Build PC Engine V6 Store EXE
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Winlator
        run: git clone --recursive https://github.com/brunodev85/winlator.git winlator

      - name: Setup dotnet 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Store.exe
        run: |
          dotnet new winforms -n PCEngineStore -o store-src --no-restore
          sed -i '/<OutputType>WinExe/a \    <EnableWindowsTargeting>true</EnableWindowsTargeting>' store-src/PCEngineStore.csproj
          cat store-src/PCEngineStore.csproj
          cat > store-src/Program.cs << 'CSCS'
          using System; using System.Drawing; using System.Windows.Forms;
          namespace PCEngineStore {
            static class Program {
              [STAThread] static void Main(){
                Application.EnableVisualStyles();
                var f=new Form(){Text="PC Engine Store V6 - EXE",Width=950,Height=650,BackColor=Color.FromArgb(0,188,212),StartPosition=FormStartPosition.CenterScreen;
                var tabs=new TabControl(){Dock=DockStyle.Fill};
                var tab1=new TabPage("Accounting");
                var p1=new FlowLayoutPanel(){Dock=DockStyle.Fill,AutoScroll=true,BackColor=Color.WhiteSmoke};
                void AddCard(FlowLayoutPanel p,string n){var c=new Panel(){Width=180,Height=120,BackColor=Color.White,Margin=new Padding(10)};var b=new Button(){Text=n,Width=160,Height=35,Top=10,Left=10,BackColor=Color.FromArgi(0,188,212),ForeColor=Color.White,FlatSytle=FlatStyle.Flat};b.Click+=(s e)->MessageBox.Show("Installing "+n);c.Controls.Add(b);p.Controls.Add(c);}
                AddCard(p1,"Excel 2024.5");AddCard(p1,"Daftra ERP");AddCard(p1,"QuickBooks");AddCard(p1,"SAP");
                tab1.Controls.Add(p1);tabs.TabPages.Add(tab1);f.Controls.Add(tabs);Application.Run(f);
              }
            }
          }
          CSCS
          dotnet restore store-src/PCEngineStore.csproj -p:EnableWindowsTargeting=true
          dotnet publish store-src/PCEngineStore.csproj -c Release -r win-x86 --self-contained false -p:EnableWindowsTargeting=true -o store-exe
          ls -lh store-exe/

      - name: Inject into Windows System Files
        run: |
          cd winlator/app
          sed -i 's/<string name="app_name">.*<\/string><string name="app_name">PC Engine V6 EXE<\/string>/g' app/src/main/res/values/strings.xml || true
          mkdir -p app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store
          cp ../../.store-exe/PCEngineStore.exe app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store/ || cp ../../.store-exe/*.exe app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store/ || true
          ls -lh app/src/main/assets/imagefs_patches/Program_Files/PC_Engine_Store/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Build APK
        working-directory: ./winlator/app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PC-Engine-V6-EXE-Fixed
          path: |
            winlator/app/app/build/outputs/apk/debug/*.apk
            store-exe/*
